<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>G2 Chronicles Debug</title>
    <script type="module" crossorigin src="./assets/index.js"></script>
  </head>
  <body style="background: #000; margin: 0; padding: 20px; font-family: monospace; color: #0f0;">
    <h2 id="status" style="font-size: 18px; margin: 0; color: #fff;">Status: Initializing...</h2>
    <div id="logs" style="background: #111; color: #0f0; padding: 10px; font-size: 12px; height: 400px; overflow-y: auto; border: 1px solid #333; margin-top: 15px;">
      App started...
    </div>
    <script>
      window.logToUI = (msg) => {
        const logs = document.getElementById('logs');
        if (logs) {
          const div = document.createElement('div');
          div.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
          logs.appendChild(div);
          logs.scrollTop = logs.scrollHeight;
        }
      };
      window.setStatus = (status) => {
        const s = document.getElementById('status');
        if (s) s.textContent = `Status: ${status}`;
      };
      window.onerror = (msg, url, line) => {
        window.logToUI(`CRITICAL ERROR: ${msg} at line ${line}`);
      };
    </script>
  </body>
</html>
