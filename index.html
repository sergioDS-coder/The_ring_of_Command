<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>G2 Chronicles Debug</title>
  </head>
  <body style="background: #000; margin: 0; padding: 20px; font-family: monospace; color: #0f0;">
    <h2 id="status" style="font-size: 14px; margin: 0;">Status: Ready</h2>
    <div id="logs" style="background: #111; color: #0f0; padding: 10px; font-size: 10px; height: 300px; overflow-y: auto; border: 1px solid #333; margin-top: 10px;">
      Init logs...
    </div>
    <script type="module" src="./src/index.ts"></script>
    <script>
      window.logToUI = (msg) => {
        const logs = document.getElementById('logs');
        if (logs) {
          const div = document.createElement('div');
          div.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
          logs.appendChild(div);
          logs.scrollTop = logs.scrollHeight;
        }
      };
      window.onerror = (msg, url, line) => {
        window.logToUI(`ERROR: ${msg} at ${line}`);
      };
    </script>
  </body>
</html>
